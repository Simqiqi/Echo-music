# 跑测试：每一次推送与每一个 PR 都验一遍单元测试与 vet。
#
# 此前只有 Release 工作流，而它只在打 tag 时构建、不跑测试，于是几条早就红了的
# 测试（帧预算、舞台菜单、歌曲菜单）在仓库里躺了很久没人发现。这里把它们挡在
# 前面：红了就看得到，不用等发版。
name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS：这些测试是为这个平台写的（窗口、声卡、渲染都不缺），同一个用例在
    # ubuntu runner 上会因为「没有音频设备」之类的环境差异报假警——notch 的问候、
    # 粒子歌词的高亮、设置里的开关都属这一类。公开仓库在 GitHub 上跑 macOS runner
    # 不额外计费。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # 只跑 internal：cmd 与 examples 是构建路径，由 Release 工作流覆盖。
      - name: Test
        run: go test ./internal/... -timeout 40m
